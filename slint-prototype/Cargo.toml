[package]
name = "bos-settings-slint"
version = "0.1.0"
description = "Slint prototype of bos-settings. Not the shipping app."
authors = ["Breadway"]
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"
slint = { version = "1.18", default-features = false, features = [
    "compat-1-2",
    "std",
    "backend-winit",
    "renderer-software",
] }
tokio = { version = "1", features = ["rt", "macros", "process"] }

[build-dependencies]
slint-build = "1.18"
