[package]
name = "bos-settings-slint"
version = "0.1.0"
description = "Slint prototype of bos-settings. Not the shipping app."
authors = ["Breadway"]
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.18", default-features = false, features = [
    "compat-1-2",
    "std",
    "backend-winit",
    "renderer-software",
] }
tokio = { version = "1", features = ["rt", "macros", "process"] }

# Wallpaper thumbnails decode in the prototype; image decoding in an
# unoptimised debug build takes seconds per 4K file.
[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
slint-build = "1.18"
