name: check

# Lint + test on work branches AND on `main`: a push to `main` publishes a
# dev-track build (dev-release.yml), so it should be clippy'd and tested
# first. Before this the only CI here was the dev/rc/release publish
# workflows, none of which run clippy or the test suite.
#
# The Tauri crate lives at ./src (not the usual src-tauri). clippy and the
# test suite don't need the *built* frontend, but `tauri::generate_context!`
# panics at compile time if the `frontendDist` dir (../frontend/build) is
# missing, so we stub an empty one; still no `npm` step, still fast.
#
# The tree was normalised with a dedicated `cargo fmt --all` commit (see
# .git-blame-ignore-revs), so fmt is now gated too.
#
# Builds in the same dev mode as dev-release.yml (git.breadway.dev
# dependencies patched to their own repo's main via bread-ecosystem's
# scripts/dev-deps.sh, no --locked), so a PR that depends on a
# just-merged, not-yet-tagged change in bread-ecosystem passes here
# instead of only being testable after a tag bump. See bread-ecosystem's
# docs/release-channels.md ("Cross-repo dependency resolution") for the
# full model. Part of ECO-38.
on:
  push:
    branches: ['feature/**', 'fix/**', 'main']

jobs:
  check:
    runs-on: [self-hosted]
    steps:
      - name: checkout
        run: |
          set -euo pipefail
          rm -rf src && mkdir src
          git clone --branch "${GITHUB_REF_NAME}" --depth 1 \
            "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" src

      - name: stub frontendDist
        run: mkdir -p src/frontend/build

      - name: clone bread-ecosystem (main)
        run: |
          set -euo pipefail
          ECOSYSTEM_CI_DIR="$(mktemp -d /tmp/bread-ecosystem-check-XXXXXX)"
          git clone --branch main https://git.breadway.dev/Breadway/bread-ecosystem.git "${ECOSYSTEM_CI_DIR}"
          echo "ECOSYSTEM_CI_DIR=${ECOSYSTEM_CI_DIR}" >> "$GITHUB_ENV"

      # Fails if any git.breadway.dev dependency in src/src's Cargo.toml
      # uses rev/branch/path instead of tag. Cargo.toml itself must always
      # stay tag-pinned; dev-mode resolution to main happens only at build
      # time, below, never by editing the manifest.
      - name: lint git.breadway.dev dependency pins
        run: bash "${ECOSYSTEM_CI_DIR}/scripts/lint-pins.sh" --root src/src

      # No ci/build.sh docker wrapper here (plain cargo, unlike the
      # layer-shell GTK4 apps), so dev-deps.sh's default sibling
      # DEV_DEPS_DIR (relative to src/src) works as-is.
      - name: resolve dev dependencies to main
        run: |
          set -euo pipefail
          cd src/src
          bash "${ECOSYSTEM_CI_DIR}/scripts/dev-deps.sh" --root .
          rm -rf "${ECOSYSTEM_CI_DIR}"

      - name: fmt
        run: cd src/src && cargo fmt --all -- --check

      - name: clippy
        run: cd src/src && cargo clippy --all-targets -- -D warnings

      - name: test
        run: cd src/src && cargo test
